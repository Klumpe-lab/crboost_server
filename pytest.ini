[pytest]
testpaths = tests
pythonpath = .
# `pytest` alone runs the headnode tier; `pytest -m cluster` (or `-m repo`) replaces this selection.
addopts = -m "not cluster and not repo"
markers =
    cluster: submits one short SLURM job per configured tool and waits for it (minutes)
    repo: what every checkout ships, checked on the templates without a site (tests/test_repo.py; ./crboost ci)
