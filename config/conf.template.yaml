# CryoBoost Server Configuration
# Copy this file to conf.yaml and fill in your values

# Python interpreter the pipeline drivers run with on the compute nodes. Leave empty to use
# the interpreter that runs the server (your venv, conda or uv environment).
crboost_python: ""

local:
  # Default directory where new projects will be created
  DefaultProjectBase: "/path/to/your/projects"
  
  # Default glob patterns for data import (optional, can be left empty)
  DefaultMoviesGlob: ""
  DefaultMdocsGlob: ""

  # What users ssh to from their own computer, if not this headnode itself: a login alias that lands on any
  # of several login nodes (e.g. cbe.next). The startup banner's tunnel then goes through it to this headnode.
  SshLoginHost: ""

slurm_defaults:
  # These are starting defaults - users can override per-job in the UI
  partition: "gpu"
  constraint: ""
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 4
  gres: "gpu:1"
  mem: "32G"
  time: "2:00:00"


# Resources for the lightweight supervisor sbatch used by array-dispatching jobs
# (ts_reconstruct, ts_alignment, ts_ctf, fs_motion_and_ctf).
# The supervisor submits a child SLURM array, polls until done, and runs
# pure-Python metadata aggregation — no GPU work. The user-facing slurm_defaults
# above describe PER-TASK resources for the array's child sbatch.
# Where to put it: a CPU partition if yours starts small jobs promptly. Each stage's supervisor enters the queue only
# when the stage before ends, so a busy CPU partition adds its whole wait at every stage boundary; on CBE.next that
# was 30 minutes to hours between GPU stages of minutes. There the supervisor rides the GPU partition on the cheapest
# cards as a ticket it never uses (partition: "g", gres: "gpu:1", constraint: "rtx6000|a100": any RTX 6000 or A100,
# 2 to 6 an hour, never a B200 at 24), and so do the CPU-only job profiles below.
supervisor_slurm:
  partition: "gpu"
  constraint: ""
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 1
  gres: ""
  mem: "4G"
  # The supervisor waits for its whole array, queue time included: give it the longest time your QOS
  # allows, or a long QOS (`sacctmgr show qos format=Name,MaxWall`). One that times out leaves every
  # task done but the job Failed; Run then aggregates in place without recomputing.
  time: "4:00:00"
  qos: ""

# Per-job-type resource defaults for SLURM submissions.
# Keys must match JobType enum values (e.g. fsMotionAndCtf, tsReconstruct).
# Only fields present here override slurm_defaults; omitted fields inherit.
# Users can still override per-job in the UI (slurm_overrides).
# Merge order: slurm_defaults <- job_resource_profiles[jobtype] <- slurm_overrides
# Besides sbatch's own fields a profile takes `prefer` (sbatch --prefer: node features tried first; when no such
# node is free the job starts on what `constraint` allows instead of waiting) and `avoid` (node features to stay
# off: the nodes that have one are sent as --exclude, since SLURM's expressions have no NOT).
job_resource_profiles:
  # The short Warp and AreTomo steps (motion, alignment, CTF, reconstruct, export) run on any GPU, MIG slices
  # included: an untyped "gpu:1" takes whichever is free first, so a pipeline is not held up waiting for a full card.
  # On CBE.next a 1g.23gb slice runs them 1.4-3x slower at a seventh of the billing (roadmap 45). Size mem so a task
  # succeeds on either; name a type only for a job a small card cannot hold (segment, template matching).
  fsMotionAndCtf:
    # mem=24G pairs with perdevice=2 (default in FsMotionCtfParams): two
    # concurrent EER movies per GPU need ~12-18GB GPU RAM plus host-side
    # frame-staging buffers. Drop to 16G if you set perdevice=1, or push to
    # 32G if you set perdevice=4 on an A100.
    gres: "gpu:1"
    mem: "24G"
    cpus_per_task: 2
    time: "0:30:00"

  aligntiltsWarp:
    gres: "gpu:1"
    mem: "16G"
    cpus_per_task: 2
    time: "0:15:00"

  # One job on one node (not a per-TS array): num_gpus of the card the GRES names (a full card; the trainer is
  # card-bound on an RTX 6000 and mostly idle on a B200, where the CPUs set the speed: they become patch builders
  # and loaders). The training pool lives in the node's RAM and the job adds it to mem. `time` is a floor, scaled
  # by n_ts x n_macro_iterations at deploy time (MissAlignParams.get_effective_slurm_config).
  missAlign:
    gres: "gpu:nvidia_b200:1"
    mem: "160G"
    cpus_per_task: 48
    time: "2:00:00"
    # The scaled time can pass the default QOS's 8 h; g_medium allows 2 days (`sacctmgr show qos format=Name,MaxWall`).
    qos: "g_medium"

  tsCtf:
    gres: "gpu:1"
    mem: "8G"
    cpus_per_task: 2
    time: "0:10:00"

  # Per tilt series: a task of tilt_series_per_task (default 8) runs perdevice (default 2) at once, and asks for
  # perdevice x the CPUs and memory and its rounds x the time. 24G is the peak on 1024 x 1024 x 512 tomograms plus
  # half; a tilt series took 41 s on a B200 and 170 s on a 1g.23gb slice at the median, 419 s at worst. Where the
  # partition also offers MIG slices, name the full GPU's type (CBE.next: "gpu:nvidia_b200:1"): a chunk is slower
  # on a small slice than single tasks, and billed for its CPUs.
  tsReconstruct:
    gres: "gpu:1"
    mem: "24G"
    cpus_per_task: 4
    time: "0:20:00"

  # CPU only. import_calls (default 4) WarpTools ts_import calls run at once on these CPUs, each keeping about two
  # busy: 163 tilt series take about 1.5 minutes on 8 CPUs against 12 in one call on one. Where the GPU partition
  # refuses a job without a GPU, either name a CPU partition for it and the other gres "" profiles (partition: "c")
  # or, if that partition queues long, give them the cheapest cards as a ticket (CBE.next: partition: "g",
  # gres: "gpu:1", constraint: "rtx6000|a100"; see supervisor_slurm).
  tsImport:
    gres: ""
    mem: "16G"
    cpus_per_task: 8
    time: "0:30:00"

  denoisetrain:
    gres: "gpu:1"
    # IsoNet refine ends with a predict pass that tiles a full ~1k^3 tomogram into
    # overlapping cubes in RAM (2GB volume -> tens of GB of cube/output stacks). 32G
    # OOM-kills mid-predict on a 1024x1024x512 dataset; g-nodes have 256G+.
    mem: "128G"
    cpus_per_task: 4
    # IsoNet training runs for hours; run_command's watchdog kills the tool at 0.9x the
    # remaining walltime, and ~30 min of mask/extract prep runs first -- so the effective
    # IsoNet budget is well under --time. 8h gives ~6.5h of real compute (QOS rejects 12h).
    time: "8:00:00"
    # The default QOS caps a job at 8 h; the time here can grow past that, so ask for g_medium (2 days).
    qos: "g_medium"

  denoisepredict:
    gres: "gpu:1"
    mem: "16G"
    cpus_per_task: 2
    time: "0:20:00"

  # Per tomogram. easymode peaked at 22 GB of GPU memory on a 264 x 530 x 530 tomogram: where the partition also
  # offers smaller cards or MIG slices, name the full GPU's type (CBE.next: "gpu:nvidia_b200:1").
  segment:
    gres: "gpu:1"
    mem: "32G"
    cpus_per_task: 8
    time: "2:00:00"

  # A whole 1024 x 1024 x 512 tomogram needs ~31 GiB of GPU memory (roadmap 43 S1); gpu_split auto splits it to
  # fit the GPU a task gets, at a cost in time. Where the partition also offers smaller cards or MIG slices, name
  # the full GPU's type (CBE.next: "gpu:nvidia_b200:1"). Per tomogram: a task runs lanes (default 3) at once under
  # MPS, tomograms_per_lane (default 2) each, and asks for lanes x the CPUs and memory, tomograms_per_lane x the time.
  templatematching:
    gres: "gpu:1"
    mem: "32G"
    cpus_per_task: 4
    time: "1:30:00"

  # Candidate extraction computes on the CPU, but pytom_extract_candidates.py cannot start without a CUDA device
  # (voltools asks cupy for the device count at import): give it the smallest GPU the partition offers
  # (CBE.next: "gpu:nvidia_b200_1g.23gb:1", one MIG slice).
  tmextractcand:
    gres: "gpu:1"
    mem: "8G"
    cpus_per_task: 2
    time: "0:15:00"

  # One CPU job over every tomogram: Ais runs one process per CPU.
  filamentPick:
    gres: ""
    mem: "32G"
    cpus_per_task: 8
    time: "1:00:00"

  # Subtomogram extraction (also per pick list) and particle reconstruction run on CPUs only (relion_tomo_subtomo,
  # relion_tomo_reconstruct_particle start without a GPU). Where the GPU partition refuses a job without one, see the
  # tsImport note: a CPU partition, or the cheapest cards as a ticket (CBE.next: partition: "g", gres: "gpu:1",
  # constraint: "rtx6000|a100").
  subtomoExtraction:
    gres: ""
    mem: "16G"
    cpus_per_task: 4
    time: "0:30:00"

  extractPickList:
    gres: ""
    mem: "16G"
    cpus_per_task: 4
    time: "0:30:00"

  warpExport:
    gres: "gpu:1"
    mem: "32G"
    cpus_per_task: 4
    time: "0:30:00"

  reconstructParticle:
    gres: ""
    mem: "32G"
    cpus_per_task: 4
    time: "2:00:00"

  # The GPU comes from here (CBE.next: "gpu:nvidia_b200:1"); mem, CPUs and time from Class3D's own defaults.
  class3d:
    gres: "gpu:1"
    mem: "64G"
    cpus_per_task: 8
    time: "8:00:00"

  # mpirun -n 3: a leader and one follower per half-set, each follower on its own GPU (CBE.next:
  # "gpu:nvidia_b200:2"). With preread_images every follower holds the whole particle set in RAM.
  refine3d:
    gres: "gpu:2"
    mem: "96G"
    cpus_per_task: 8
    time: "8:00:00"

  # DL tilt-filter prediction run: one GPU job over every tilt of the project.
  tiltFilter:
    gres: "gpu:1"
    mem: "16G"
    cpus_per_task: 4
    time: "0:30:00"

processing_defaults:
  reconstruction_binning: 4

# ChimeraX + ArtiaX remote manual-picking session (launched from the UI as a
# SLURM job that serves a VNC desktop). sif_path and partition are required;
# login_host defaults to the headnode's own FQDN (what you SSH into to reach
# crboost). The session binds container_binds (below) and the project.
curation:
  sif_path: "/path/to/chimerax_artiax.sif"
  partition: "c"   # CPU partition, software GL. For fluid 3-D: point sif_path at chimerax_artiax_GL.sif,
                   # set partition: "g", gres: "gpu:1", vgl: true (VirtualGL on the GPU under apptainer --nv).
  gres: ""         # SLURM --gres for the session; "" = none (CPU). "gpu:1" on a GPU partition.
                   # VirtualGL needs a full GPU: MIG slices do CUDA only (on CBE.next: gpu:nvidia_b200:1).
  vgl: false       # render ChimeraX via VirtualGL on the GPU (needs the _GL.sif + a GPU gres).
  cpus: 4
  mem: "16G"
  time: "08:00:00"  # must be <= the QOS MaxWall for this partition (0/unlimited is rejected)
  geometry: "1920x1080"
  chimerax_bin: "chimerax"
  login_host: ""
  display_bin: 2          # open a block-binned copy of the recon (cached beside it) so ArtiaX loads in
                          # seconds instead of ~20 s. Picks stay exact — crboost records and undoes the
                          # (N-1)/2*px corner shift. 1 = off (open the full-resolution volume).
  passwordless_vnc: false # true starts the desktop with SecurityTypes None — NO password, so anyone who
                          # can reach that node's VNC port can drive the session. Leave false if shared.

# Lab-level species catalog. A shared directory holding species DEFINITIONS —
# name, diameter, symmetry, notes, templates and masks with their provenance — so the same
# particle can be started from in any project instead of being re-registered by hand. Picks,
# keep/drop filters, merges and extractions are NEVER shared: they are project-bound.
# Import and publish both COPY (a snapshot, like species values on a job); there is no live
# sync in either direction. Leave empty to switch the feature off entirely.
species_catalog_root: ""

# Tilt classifiers for the tilt-filter job's DL review. Each entry names a weights file
# (absolute, or relative to this crboost_server checkout; git ignores *.pth files),
# the network class it was trained as (filterTilts/deepLearning/model_architectures.py) and
# the input normalisation it was trained with ("per_image": each image standardised, clipped
# as its checkpoint records). `threshold` is the P(bad) cut the weights were calibrated at,
# which a job running them starts from (omit it for uncalibrated weights). The job's model
# selector lists these keys; default_model is what a job runs until the user picks another.
# Running a model needs the `tilt_filter` image (tools: below); the server's own environment has no torch.
# Leave `models` empty to run the filter by hand only.
tilt_filter:
  models:
    tiltnet_resnet18_o1034:             # written by: python -m filterTilts.deepLearning.convert_checkpoint run_best.pth <this path> (in the tilt_filter image)
      path: "filterTilts/tiltnet_resnet18_o1034.pth"
      arch: "ResNet18Gray"
      normalisation: "per_image"
      threshold: 0.301                  # the model author's cut on their own validation set, not calibrated on ours
  default_model: tiltnet_resnet18_o1034


# Container runtime on the headnode and the compute nodes: apptainer or singularity.
container_runtime: apptainer

# Host directories bound into every container call, at the same path: where your data and
# software live (e.g. [/groups, /scratch]). The project directory, the raw-data directories
# and the gain reference are bound per job on top of these; /tmp is always bound.
container_binds: []

# Lasting directory for the CUDA driver's compiled-kernel cache (CUDA_CACHE_PATH), on shared
# storage every user and install can write (e.g. /groups/<lab>/software/cache_and_artifacts/cuda_kernels).
# An image with no machine code for the node's GPU (on B200s: every CUDA 11 / TensorFlow image,
# such as cryocare, easymode, ais, pom) compiles its kernels from PTX on first GPU use: 12-22 min
# per job on a B200. Cached here (one subdirectory per image, ~1.6 GB for a TensorFlow image), that
# happens once per image and driver version, not once per job.
# Sharing is safe: the cache is keyed by the code and the driver, and the driver locks it. Empty =
# a per-user directory in the job's /tmp, which a cluster that cleans /tmp after each job wipes.
gpu_kernel_cache: ""

# Tool execution configuration
# exec_mode: 'container' or 'binary'
# container_path: path to .sif file (required if exec_mode is container)
# bin_path: directory holding the tool's executables, put first on PATH (required if exec_mode is binary)
# A tool with no entry here fails the job that needs it; nothing falls back to a guessed binary.
tools:
  warp_aretomo:
    exec_mode: "container"
    container_path: "/path/to/warp_aretomo.sif"
    bin_path: ""
  cryocare:
    exec_mode: "container"
    container_path: "/path/to/cryocare.sif"
    bin_path: ""
  # Alternative denoiser to cryoCARE, selectable per-job via DenoiseMethod.ISONET.
  isonet:
    exec_mode: "container"
    container_path: "/path/to/isonet2.sif"
    bin_path: ""
  pytom:
    exec_mode: "container"
    container_path: "/path/to/pytom_match_pick.sif"
    bin_path: ""
  relion:
    exec_mode: "container"
    container_path: "/path/to/relion5.sif"
    bin_path: ""
  imod:
    exec_mode: "container"
    container_path: "/path/to/imod.sif"
    bin_path: ""
  cistem:
    exec_mode: "binary"
    container_path: ""
    bin_path: "/path/to/cisTEM/bin"   # the directory holding `simulate`, e.g. /groups/<name_of_group>/software/cisTEM/bin
  pymol:
    exec_mode: "container"
    container_path: "/path/to/pymol.sif"
    bin_path: ""
  # warpem miss-alignment: learned tilt-series alignment refinement (Warp-native).
  miss_alignment:
    exec_mode: "container"
    container_path: "/path/to/miss_alignment.sif"
    bin_path: ""
  # The DL tilt filter's classifier (torch + torchvision, on a GPU): the tilt-filter job calls it for the network
  # only. Needed when tilt_filter.models (above) is not empty; otherwise delete this entry.
  tilt_filter:
    exec_mode: "container"
    container_path: "/path/to/tilt_filter.sif"
    bin_path: ""
  # easymode + Ais + Pom in one image (the Segment job). cache_dir holds the weights, filled once
  # with `easymode download --all` (see the image's %help); the job only ever reads them.
  easymode:
    exec_mode: "container"
    container_path: "/path/to/easymode_1.2.5.sif"
    bin_path: ""
    cache_dir: "/path/to/cache_and_artifacts/easymode_1.2.5"
    # Ais imports OpenGL on start. `--nv` mounts the host's NVIDIA libGL, which an EL10 host builds
    # for a newer glibc than this Ubuntu 20.04 image has ("GLIBC_ABI_DT_RELR not found"); with the
    # image's own library directory first, it loads the image's libGL. CUDA still comes from the host.
    image_libs_first: [/lib/x86_64-linux-gnu]