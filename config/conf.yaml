# CryoBoost Server Configuration

local:
  DefaultProjectBase: "/users/<user>/dev/crboost_server/projects"
  DefaultMoviesGlob : "/users/<user>/dev/001_CopiaTestSet/frames/*.eer"
  DefaultMdocsGlob  : "/users/<user>/dev/001_CopiaTestSet/mdoc/*.mdoc"

slurm_defaults:
  partition      : "g"
  constraint     : "g2|g3|g4"
  nodes          : 1
  ntasks_per_node: 1
  cpus_per_task  : 4
  gres           : "gpu:4"
  mem            : "64G"
  time           : "3:30:00"

containers:
  warp_aretomo: /groups/<lab>/software/Setup/cryoboost_containers/warp_2.0.0dev36_aretomo1.0.0_cuda11.8_glibc2.31.sif
  cryocare    : /users/<user>/dev/containers/cryocare.sif
  pytom       : /groups/<lab>/software/Setup/cryoboost_containers/pytom_match_pick.sif
  relion      : /users/<user>/dev/containers/relion5.0_tomo.sif
