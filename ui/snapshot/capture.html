<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taking a snapshot…</title>
<style>
  :root { --line: #dbe3ec; --ink: #0f172a; --muted: #64748b; --accent: #4a8fd4; }
  body { margin: 0; background: #f6f8fb; color: var(--ink); font: 12px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
  header { padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  #title { font-size: 14px; font-weight: 600; }
  #status { color: var(--muted); margin-top: 2px; }
  #bar { height: 3px; background: var(--line); margin-top: 8px; border-radius: 2px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
  #error { color: #b91c1c; margin-top: 6px; white-space: pre-wrap; }
  #stage { margin: 12px 16px; width: 800px; height: 500px; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  /* The workspace renders at its full size; the window shows it at half. */
  #frame { width: 1600px; height: 1000px; border: 0; transform: scale(0.5); transform-origin: 0 0; }
  #done a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div id="title">Taking a snapshot</div>
  <div id="status">Reading the project…</div>
  <div id="bar"><div></div></div>
  <div id="error"></div>
  <div id="done"></div>
</header>
<div id="stage"><iframe id="frame" title="workspace being captured"></iframe></div>
<script src="/snapshot/capture.js"></script>
</body>
</html>
