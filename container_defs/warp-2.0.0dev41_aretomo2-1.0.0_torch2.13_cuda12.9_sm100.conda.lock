# The conda packages of the running image's warp environment (warp-2.0.0dev41_aretomo2-1.0.0_cuda12.9_sm100.sif,
# conda list --explicit --md5, 2026-11-20) with PyTorch 2.13.0 in place of its 2.14.1: pytorch and libtorch are the
# 2.13.0 cuda129_mkl build 302 that warp 2.0.0dev41 was built against (the package's info/recipe/meta.yaml). Beside
# them, what that build needs and the image did not have: MKL in place of OpenBLAS (mkl, tbb, libhwloc, libxml2,
# libiconv), ICU 78 in place of 79 (libxml2 needs it; libsqlite and libpsl in their ICU 78 builds, same versions) and
# setuptools 81 (< 82). Every other package is the running image's, by URL and md5; conda checks each md5.
