# uv settings for this checkout. `uv pip compile` resolves for the cluster (Python 3.11, x86-64 Linux)
# from any machine, torch's nvidia-* dependencies included.
[pip]
# This checkout's venv, so `uv pip sync requirements.txt` needs no activation or -p (run from the repo root).
python = "venv/bin/python"
python-version = "3.11"
python-platform = "x86_64-unknown-linux-gnu"
# `uv pip sync` writes the venv's .pyc files at install time. Drivers on the compute nodes would otherwise
# compile numpy, pandas and the rest from source in every task wherever they cannot write bytecode.
compile-bytecode = true
